<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<main class="section container narrow">

    <h1>Login</h1>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <label>Username
        <input
          name="username"
          autocomplete="username"
          required>
      </label>

      <label>Password
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          required>
      </label>

      <button type="submit">Login</button>

    </form>

    <p>
      Нямате акаунт?
      <a href="{{ url_for('register_public') }}">
        Регистрация като турист
      </a>
    </p>

    <p>
      Планински водач?
      <a href="{{ url_for('register_operator') }}">
        Кандидатствайте като operator
      </a>
    </p>

</main>

</body>
</html>
