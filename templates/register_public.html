
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация | Wild Weekend</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<main class="section container narrow">

    <h1>Регистрация на турист</h1>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label>Потребителско име
            <input
                type="text"
                name="username"
                autocomplete="username"
                required>
        </label>

        <label>Имейл
            <input
                type="email"
                name="email"
                autocomplete="email"
                required>
        </label>

        <label>Парола
            <input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required>
        </label>

        <button type="submit">Регистрация</button>

    </form>

    <p>
        Вече имате акаунт?
        <a href="{{ url_for('login') }}">Вход</a>
    </p>

</main>

</body>
</html>
